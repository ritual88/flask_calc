<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор с Базой Данных</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; font-size: 16px; }
        button { background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #45a049; }
        .result { font-size: 18px; font-weight: bold; color: #333; margin-top: 10px; }
        .history { margin-top: 20px; text-align: left; border-top: 1px solid #ddd; padding-top: 10px; }
        .history h4 { margin: 0 0 5px 0; color: #555; font-size: 14px; }
        .history ul { padding-left: 20px; margin: 0; font-size: 14px; color: #666; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Калькулятор + База Данных</h2>
        
        <form method="POST">
            <input type="number" step="any" name="num1" placeholder="Первое число" required>
            <select name="operator">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
            </select>
            <input type="number" step="any" name="num2" placeholder="Второе число" required>
            <button type="submit">Посчитать</button>
        </form>

        {% if result is not none %}
            <div class="result">Результат: {{ result }}</div>
        {% endif %}

        <!-- --- БЛОК ИСТОРИИ ИЗ БАЗЫ ДАННЫХ --- -->
        {% if history %}
            <div class="history">
                <h4>История последних вычислений:</h4>
                <ul>
                    <!-- Цикл по записям из базы данных -->
                    {% for item in history %}
                        <li>{{ item[0] }} {{ item[1] }} {{ item[2] }} = {{ item[3] }}</li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}
    </div>

</body>
</html>
